<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080812">
  <meta name="description" content="HR Tube — Discover and watch YouTube videos.">
  <title>HR Tube</title>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg:#080812; --panel:#121222; --panel2:#1a1a30;
      --text:#f5f5ff; --muted:#a3a3bd; --accent:#a855f7;
      --cyan:#22d3ee; --border:#292943;
    }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; min-height:100vh; }
    button,input { font:inherit; } button { cursor:pointer; }
    header { position:sticky; top:0; z-index:10; background:rgba(8,8,18,.96); border-bottom:1px solid var(--border); padding:14px 16px; }
    .topbar { max-width:1200px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .logo { font-size:25px; font-weight:900; letter-spacing:-1px; color:white; white-space:nowrap; }
    .logo span { color:var(--cyan); }
    .search { display:flex; flex:1; max-width:600px; min-width:190px; gap:8px; }
    input { width:100%; min-width:0; padding:12px 14px; color:white; background:var(--panel); border:1px solid var(--border); border-radius:12px; outline:none; }
    input:focus { border-color:var(--accent); }
    .btn { padding:11px 15px; color:white; background:linear-gradient(135deg,#9333ea,#6d28d9); border:0; border-radius:11px; font-weight:bold; }
    .btn:disabled { opacity:.6; cursor:wait; }
    .sign-in { max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:9px 12px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:white; }
    main { max-width:1200px; margin:auto; padding:20px 16px 40px; }
    .hero { padding:22px 18px; margin-bottom:22px; border:1px solid #34305a; border-radius:18px; background:radial-gradient(ellipse at top right,#3b1767 0,transparent 60%),linear-gradient(135deg,#17132a,#0e1727); }
    .hero h1 { margin:0 0 8px; font-size:clamp(25px,5vw,38px); }
    .hero p { margin:0; color:var(--muted); line-height:1.5; }
    .categories { display:flex; gap:9px; overflow-x:auto; padding:2px 0 15px; scrollbar-width:thin; }
    .category { flex:0 0 auto; padding:9px 15px; border-radius:30px; border:1px solid var(--border); background:var(--panel); color:white; }
    .category.active { background:var(--accent); border-color:var(--accent); }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 0 16px; }
    .section-heading h2 { font-size:21px; margin:0; }
    #status { color:var(--muted); font-size:13px; margin:10px 0 16px; line-height:1.5; }
    .videos { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .video-card { min-width:0; overflow:hidden; background:var(--panel); border:1px solid var(--border); border-radius:14px; transition:border-color .2s,transform .2s; }
    .video-card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .thumbnail { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#202035; cursor:pointer; }
    .video-info { padding:12px; }
    .video-title { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.45; min-height:42px; font-size:15px; font-weight:bold; }
    .channel { color:var(--muted); font-size:13px; margin:9px 0 12px; overflow-wrap:anywhere; }
    .watch-btn { width:100%; padding:10px; background:var(--panel2); border:1px solid var(--border); border-radius:9px; color:white; }
    .watch-btn:hover { background:#30204b; border-color:var(--accent); }
    .empty { padding:30px 15px; text-align:center; border:1px dashed var(--border); border-radius:14px; color:var(--muted); line-height:1.6; }
    .player-modal { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.88); }
    .player-modal.open { display:flex; }
    .player-box { width:100%; max-width:900px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:12px; }
    .player-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .player-top h3 { font-size:16px; margin:0; }
    .close-btn { background:#28283e; color:white; border:0; border-radius:8px; padding:9px 13px; }
    .player-frame { display:block; width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:black; }
    .youtube-link { display:block; margin-top:12px; text-align:center; color:var(--cyan); text-decoration:none; padding:10px; }
    footer { text-align:center; padding:22px 16px; color:var(--muted); border-top:1px solid var(--border); font-size:13px; line-height:1.6; }
    @media(max-width:850px) { .videos { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:520px) {
      header { padding:12px; } .topbar { gap:10px; } .logo { font-size:23px; }
      .search { order:3; flex-basis:100%; max-width:none; } main { padding:15px 12px 30px; }
      .hero { padding:19px 15px; } .videos { grid-template-columns:1fr; gap:14px; }
      .video-title { min-height:auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="logo">HR <span>TUBE</span></div>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="Search YouTube videos..." aria-label="Search videos" required>
        <button class="btn" type="submit">Search</button>
      </form>
      <button class="sign-in" id="signInButton" type="button">Sign in with Google</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Discover something awesome ✨</h1>
      <p>Explore videos, search your interests, and watch your favorites with HR Tube.</p>
    </section>
    <nav class="categories" id="categories" aria-label="Video categories">
      <button class="category active" data-query="trending videos" type="button">Trending</button>
      <button class="category" data-query="gaming" type="button">Gaming</button>
      <button class="category" data-query="technology" type="button">Technology</button>
      <button class="category" data-query="music" type="button">Music</button>
      <button class="category" data-query="sports" type="button">Sports</button>
      <button class="category" data-query="education" type="button">Education</button>
      <button class="category" data-query="comedy" type="button">Comedy</button>
      <button class="category" data-query="cooking" type="button">Cooking</button>
      <button class="category" data-query="Islamic lectures" type="button">Islamic</button>
    </nav>
    <section>
      <div class="section-heading"><h2 id="sectionTitle">Recommended Videos</h2></div>
      <p id="status" role="status" aria-live="polite">Loading videos...</p>
      <div class="videos" id="videos"></div>
    </section>
  </main>

  <div class="player-modal" id="playerModal" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="player-box">
      <div class="player-top">
        <h3 id="playerTitle">Now Playing</h3>
        <button class="close-btn" id="closePlayer" type="button">Close ✕</button>
      </div>
      <iframe id="playerFrame" class="player-frame" title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <a id="youtubeLink" class="youtube-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a>
    </div>
  </div>

  <footer>HR Tube · Discover and watch videos<br>Videos are provided by YouTube.</footer>

  <script>
    "use strict";

    // Replace with your NEW restricted YouTube Data API v3 key.
    const YOUTUBE_API_KEY = "AIzaSyDPpZTfbeB50jY6cJM2QrC-iLBdFbkG5GM";

    // Replace the placeholder values with your exact Firebase web app config.
    // Find them in Firebase Console > Project settings > Your apps.
    const firebaseConfig = {
      apiKey: "AIzaSyD7oQCY69awzq1tLgtWH5wqrr5ujYHxnL4",
      authDomain: "hr-tube-44004.firebaseapp.com",
      projectId: "hr-tube-44004",
      appId: "1:118222363031:web:c14f3f1c43aaec45598cd2"
    };

    const videosEl = document.getElementById("videos");
    const statusEl = document.getElementById("status");
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const sectionTitle = document.getElementById("sectionTitle");
    const categoriesEl = document.getElementById("categories");
    const playerModal = document.getElementById("playerModal");
    const playerFrame = document.getElementById("playerFrame");
    const playerTitle = document.getElementById("playerTitle");
    const youtubeLink = document.getElementById("youtubeLink");
    const signInButton = document.getElementById("signInButton");

    let currentQuery = "trending videos";
    let requestNumber = 0;
    let auth = null;
    let authReady = false;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char];
      });
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleDateString(undefined, {year:"numeric",month:"short",day:"numeric"});
    }

    function showPlayer(videoId, title) {
      if (!videoId) return;
      playerTitle.textContent = title || "Now Playing";
      playerFrame.src = "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId) + "?autoplay=1&rel=0";
      youtubeLink.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);
      playerModal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePlayer() {
      playerModal.classList.remove("open");
      playerFrame.src = "";
      document.body.style.overflow = "";
    }

    document.getElementById("closePlayer").addEventListener("click", closePlayer);
    playerModal.addEventListener("click", event => {
      if (event.target === playerModal) closePlayer();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePlayer();
    });

    function makeVideoCard(video) {
      const snippet = video.snippet || {};
      const videoId = video.id && typeof video.id === "object" ? video.id.videoId : video.id;
      if (!videoId) return null;

      const title = snippet.title || "Untitled video";
      const channel = snippet.channelTitle || "YouTube creator";
      const published = formatDate(snippet.publishedAt);
      const thumbs = snippet.thumbnails || {};
      const thumbnail = (thumbs.high && thumbs.high.url) ||
        (thumbs.medium && thumbs.medium.url) ||
        (thumbs.default && thumbs.default.url) || "";

      const card = document.createElement("article");
      card.className = "video-card";
      card.innerHTML = `
        <img class="thumbnail" src="${escapeHTML(thumbnail)}" alt="${escapeHTML(title)}" loading="lazy" referrerpolicy="no-referrer">
        <div class="video-info">
          <div class="video-title">${escapeHTML(title)}</div>
          <div class="channel">${escapeHTML(channel)}${published ? " · " + escapeHTML(published) : ""}</div>
          <button class="watch-btn" type="button">▶ Watch video</button>
        </div>`;
      card.querySelector(".watch-btn").addEventListener("click", () => showPlayer(videoId, title));
      card.querySelector(".thumbnail").addEventListener("click", () => showPlayer(videoId, title));
      return card;
    }

    async function fetchVideos(query) {
      const thisRequest = ++requestNumber;
      currentQuery = query;
      videosEl.replaceChildren();
      sectionTitle.textContent = query.toLowerCase() === "trending videos"
        ? "Recommended Videos" : "Results for: " + query;

      if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "PASTE_YOUR_RESTRICTED_API_KEY_HERE") {
        setStatus("Setup needed: add your YouTube Data API v3 key.");
        videosEl.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <strong>YouTube API key required</strong><br>
          Add a valid, restricted YouTube Data API v3 key to this file.
        </div>`;
        return;
      }

      setStatus("Finding videos...");
      videosEl.innerHTML = `<div class="empty" style="grid-column:1/-1">Please wait...</div>`;

      const params = new URLSearchParams({
        part:"snippet", type:"video", maxResults:"18", q:query,
        safeSearch:"moderate",
        order:query.toLowerCase() === "trending videos" ? "viewCount" : "relevance",
        key:YOUTUBE_API_KEY
      });

      try {
        const response = await fetch("https://www.googleapis.com/youtube/v3/search?" + params.toString());
        const data = await response.json();
        if (thisRequest !== requestNumber) return;

        if (!response.ok) {
          const reason = data.error && data.error.errors && data.error.errors[0] && data.error.errors[0].reason;
          let message = (data.error && data.error.message) || "YouTube request failed (" + response.status + ").";
          if (response.status === 403) {
            message = "YouTube API access denied. Check your API key, API restrictions, website restrictions, and remaining quota. " +
              (reason ? "Reason: " + reason : "");
          }
          throw new Error(message);
        }

        const items = Array.isArray(data.items) ? data.items : [];
        videosEl.replaceChildren();

        if (!items.length) {
          setStatus("No videos found. Try another search.");
          videosEl.innerHTML = `<div class="empty" style="grid-column:1/-1">No videos found. Try different words.</div>`;
          return;
        }

        items.forEach(video => {
          const card = makeVideoCard(video);
          if (card) videosEl.appendChild(card);
        });
        setStatus("Found " + items.length + " videos. Select one to watch.");
      } catch (error) {
        if (thisRequest !== requestNumber) return;
        console.error("HR Tube error:", error);
        setStatus("Unable to load videos.");
        videosEl.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <strong>Videos could not load</strong><br><br>${escapeHTML(error.message || "An unexpected error occurred.")}<br><br>
          Check your internet connection and Google Cloud API settings.<br><br>
          <button class="btn" id="retryButton" type="button">Try again</button>
        </div>`;
        document.getElementById("retryButton").addEventListener("click", () => fetchVideos(currentQuery));
      }
    }

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) { searchInput.focus(); return; }
      categoriesEl.querySelectorAll(".category").forEach(button => button.classList.remove("active"));
      fetchVideos(query);
    });

    categoriesEl.addEventListener("click", event => {
      const button = event.target.closest(".category");
      if (!button) return;
      categoriesEl.querySelectorAll(".category").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      searchInput.value = "";
      fetchVideos(button.dataset.query);
    });

    function initializeFirebaseAuth() {
      try {
        const configIsIncomplete =
          firebaseConfig.apiKey === "PASTE_FIREBASE_API_KEY_HERE" ||
          firebaseConfig.appId === "PASTE_FIREBASE_APP_ID_HERE" ||
          !firebaseConfig.authDomain ||
          firebaseConfig.authDomain.includes("PASTE_");

        if (configIsIncomplete) {
          signInButton.textContent = "Sign-in setup needed";
          signInButton.title = "Add your Firebase web app configuration first.";
          console.warn("Add the actual Firebase web app configuration.");
          return;
        }

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(error => {
          console.error("Firebase persistence error:", error);
        });

        const googleProvider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged(user => {
          authReady = true;
          signInButton.disabled = false;

          if (user) {
            const firstName = user.displayName ? user.displayName.split(" ")[0] : "there";
            signInButton.textContent = "Sign out (" + firstName + ")";
            signInButton.title = user.email || "Signed in with Google";
            signInButton.setAttribute("aria-label", "Sign out");
          } else {
            signInButton.textContent = "Sign in with Google";
            signInButton.title = "";
            signInButton.setAttribute("aria-label", "Sign in with Google");
          }
        });

        auth.getRedirectResult().catch(error => {
          console.error("Google sign-in error:", error);
          alert("Google sign-in failed: " + (error.message || "Check Firebase settings."));
        });

        signInButton.addEventListener("click", async () => {
          if (!authReady) {
            alert("Authentication is loading. Please try again.");
            return;
          }

          signInButton.disabled = true;
          try {
            if (auth.currentUser) {
              await auth.signOut();
            } else {
              await auth.signInWithRedirect(googleProvider);
            }
          } catch (error) {
            console.error("Authentication error:", error);
            alert("Sign-in failed: " + (error.message || "Check Firebase settings."));
            signInButton.disabled = false;
          }
        });
      } catch (error) {
        console.error("Firebase setup error:", error);
        signInButton.textContent = "Sign-in unavailable";
      }
    }

    window.addEventListener("load", () => {
      initializeFirebaseAuth();
      fetchVideos("trending videos");
    });
  </script>
</body>
                                     </html>
