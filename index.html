
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<meta name="description" content="HR Tube helps you discover and watch YouTube videos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>HR Tube</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{padding:16px;background:#181818;position:sticky;top:0;z-index:5;border-bottom:1px solid #333}
.brand{font-size:27px;font-weight:bold;color:#ff3030}
.brand span{color:white}
.search{display:flex;gap:8px;margin-top:15px}
input{min-width:0;flex:1;padding:12px;border-radius:25px;border:1px solid #444;background:#252525;color:white;font-size:16px}
button{padding:10px 15px;border:0;border-radius:22px;background:#ff3030;color:white;cursor:pointer;font-weight:bold}
#signin{margin-top:12px}
#user{font-size:13px;color:#bbb}
.categories{display:flex;gap:9px;padding:14px;overflow-x:auto;white-space:nowrap}
.categories button{background:#292929}
.categories button.active{background:white;color:#111}
#status{padding:0 15px;color:#bbb}
#videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:15px}
.video{cursor:pointer;min-width:0}
.video img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#222}
.video h3{font-size:15px;line-height:1.4;margin:9px 0 6px}
.video p{font-size:13px;color:#aaa;margin:0 0 5px}
.download-box{padding:16px;background:#181818;margin:15px;border-radius:12px;border:1px solid #333}
.download-box h3{margin-top:0}
.download-box input{width:100%;margin-bottom:10px}
.download-box button{width:100%}
#downloadStatus{font-size:13px;color:#bbb;overflow-wrap:anywhere}
#playerWrap{display:none;padding:15px}
#player{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.close{background:#333;margin-bottom:10px}
footer{text-align:center;padding:25px;color:#888}
button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:3px}
@media(max-width:500px){
  #videos{grid-template-columns:1fr}
  .brand{font-size:24px}
}
</style>
</head>

<body>
<header>
  <div class="brand">▶ <span>HR</span> Tube</div>
  <div class="search">
    <input id="query" type="search"
      placeholder="Search YouTube videos..." aria-label="Search videos">
    <button id="searchBtn">Search</button>
  </div>
  <div id="signin"></div>
  <p id="user"></p>
</header>

<nav class="categories" id="categories" aria-label="Video categories"></nav>

<section class="download-box">
  <h3>Download Video</h3>
  <input id="videoLink" type="url"
    placeholder="Paste a direct video URL (.mp4)"
    aria-label="Video download link">
  <button id="downloadBtn">Download Video</button>
  <p id="downloadStatus">
    Paste a direct video-file link that permits downloading.
  </p>
</section>

<section id="playerWrap">
  <button class="close" id="closePlayer">✕ Close video</button>
  <iframe id="player" title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <h3 id="playingTitle"></h3>
</section>

<p id="status" role="status">Loading videos...</p>
<main id="videos"></main>
<footer>HR Tube © 2026 — Discover videos you love.</footer>

<script>
"use strict";

// Add a restricted YouTube Data API key here.
// Never use an unrestricted key in public website code.
const YOUTUBE_API_KEY = "YOUR_RESTRICTED_YOUTUBE_API_KEY";

const GOOGLE_CLIENT_ID =
"855053512749-uakms5on2itlcql7ld2nvd5rlkecf2am.apps.googleusercontent.com";

const categories = [
  "For You","Music","Gaming","Sports","News","Comedy",
  "Movies","Education","Technology","Science","Travel",
  "Cooking","Podcasts","Full Videos"
];

const categoryBar = document.getElementById("categories");
const videosEl = document.getElementById("videos");
const statusEl = document.getElementById("status");
const queryEl = document.getElementById("query");
const playerWrap = document.getElementById("playerWrap");
const player = document.getElementById("player");

let requestNumber = 0;

categories.forEach(category => {
  const button = document.createElement("button");
  button.textContent = category;
  button.className = category === "For You" ? "active" : "";

  button.addEventListener("click", () => {
    categoryBar.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", b === button)
    );

    queryEl.value = "";

    const term = category === "For You"
      ? "popular videos"
      : category === "Full Videos"
        ? "popular full length videos"
        : category;

    searchVideos(term, category === "Full Videos");
  });

  categoryBar.appendChild(button);
});

// Download direct video files only where the host permits it.
document.getElementById("downloadBtn").addEventListener("click", () => {
  const input = document.getElementById("videoLink");
  const status = document.getElementById("downloadStatus");
  const rawUrl = input.value.trim();

  if (!rawUrl) {
    status.textContent = "Please paste a video link first.";
    return;
  }

  let url;

  try {
    url = new URL(rawUrl);
  } catch {
    status.textContent = "Please enter a valid video URL.";
    return;
  }

  if (url.protocol !== "https:" && url.protocol !== "http:") {
    status.textContent = "Please enter a valid HTTP or HTTPS link.";
    return;
  }

  if (
    url.hostname === "youtube.com" ||
    url.hostname.endsWith(".youtube.com") ||
    url.hostname === "youtu.be" ||
    url.hostname.endsWith(".youtu.be")
  ) {
    status.textContent =
      "YouTube links are not direct video files. Use YouTube's official download options where available.";
    return;
  }

  const link = document.createElement("a");
  link.href = url.href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.download = "";

  document.body.appendChild(link);
  link.click();
  link.remove();

  status.textContent =
    "Download request opened. If the video plays instead, use the file host's download option.";
});

function openVideo(id, title) {
  player.src = "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id) + "?autoplay=1";

  document.getElementById("playingTitle").textContent = title;
  playerWrap.style.display = "block";
  playerWrap.scrollIntoView({behavior:"smooth",block:"start"});
}

document.getElementById("closePlayer").addEventListener("click", () => {
  player.src = "";
  playerWrap.style.display = "none";
});

function makeVideoCard(video) {
  const id = video.id.videoId;
  const s = video.snippet;
  const card = document.createElement("article");
  card.className = "video";

  const img = document.createElement("img");
  img.src = s.thumbnails.medium?.url ||
            s.thumbnails.default?.url || "";
  img.alt = s.title;
  img.loading = "lazy";

  const title = document.createElement("h3");
  title.textContent = s.title;

  const channel = document.createElement("p");
  channel.textContent = s.channelTitle;

  const date = document.createElement("p");
  date.textContent = s.publishedAt
    ? new Date(s.publishedAt).toLocaleDateString() : "";

  card.append(img, title, channel, date);
  card.addEventListener("click", () => openVideo(id, s.title));

  return card;
}

async function fetchVideos(term, duration, limit) {
  const params = new URLSearchParams({
    part: "snippet",
    maxResults: String(limit),
    type: "video",
    q: term,
    safeSearch: "moderate",
    videoDuration: duration,
    key: YOUTUBE_API_KEY
  });

  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/search?" + params
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error?.message ||
      "YouTube API request failed.");
  }

  return data.items || [];
}

async function searchVideos(term, fullVideos = false) {
  const current = ++requestNumber;

  if (!YOUTUBE_API_KEY ||
      YOUTUBE_API_KEY === "YOUR_RESTRICTED_YOUTUBE_API_KEY") {
    statusEl.textContent =
      "Configure your restricted YouTube API key to load videos.";
    videosEl.replaceChildren();
    return;
  }

  statusEl.textContent = fullVideos
    ? "Loading regular videos..."
    : "Loading videos...";

  videosEl.replaceChildren();

  try {
    let items;

    if (fullVideos) {
      const results = await Promise.all([
        fetchVideos(term, "medium", 12),
        fetchVideos(term, "long", 12)
      ]);

      if (current !== requestNumber) return;

      const combined = [...results[0], ...results[1]];
      const unique = new Map();

      combined.forEach(video => {
        if (video.id?.videoId) {
          unique.set(video.id.videoId, video);
        }
      });

      items = [...unique.values()];
    } else {
      items = await fetchVideos(term, "any", 24);
    }

    if (current !== requestNumber) return;

    if (!items.length) {
      statusEl.textContent = "No videos found. Try another search.";
      return;
    }

    const fragment = document.createDocumentFragment();

    items.forEach(video => {
      if (video.id?.videoId && video.snippet?.thumbnails) {
        fragment.appendChild(makeVideoCard(video));
      }
    });

    videosEl.appendChild(fragment);
    statusEl.textContent =
      "Showing " + videosEl.children.length + " videos for: " + term;
  } catch (error) {
    if (current !== requestNumber) return;
    statusEl.textContent = "Error: " + error.message +
      " Check your API key restrictions and quota.";
  }
}

document.getElementById("searchBtn").addEventListener("click", () => {
  const term = queryEl.value.trim();
  if (term) searchVideos(term);
});

queryEl.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    const term = queryEl.value.trim();
    if (term) searchVideos(term);
  }
});

/* Google Sign-In */
function handleGoogleSignIn(response) {
  try {
    const payload = response.credential.split(".")[1];
    const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");

    const decoded = decodeURIComponent(
      atob(base64).split("").map(c =>
        "%" + c.charCodeAt(0).toString(16).padStart(2,"0")
      ).join("")
    );

    const user = JSON.parse(decoded);
    document.getElementById("user").textContent =
      "Signed in as " + (user.name || user.email || "Google user");
  } catch {
    document.getElementById("user").textContent =
      "Sign-in completed, but profile details could not be displayed.";
  }
}

function initializeGoogleSignIn() {
  if (!window.google?.accounts?.id) {
    setTimeout(initializeGoogleSignIn, 300);
    return;
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleSignIn
  });

  google.accounts.id.renderButton(
    document.getElementById("signin"),
    {theme:"filled_black",size:"large",shape:"pill",text:"signin_with"}
  );
}

initializeGoogleSignIn();
searchVideos("popular videos");

/* Register the service worker for PWA support. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.error("Service worker registration failed:", error));
  });
}
</script>
</body>
</html>
